<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Coast Soapery | Organic Handmade Soaps</title>
    <meta name="description" content="Discover our organic, handmade soaps crafted with love at Coral Coast Soapery.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <img src="logo/CORAL COAST_LOGO.jpg" alt="Coral Coast Soapery Logo">
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="cart-icon" id="cart-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-amount">$0.00</span>
            </div>
            <a href="checkout.html" class="btn btn-primary checkout-btn">Proceed to Checkout</a>
        </div>
    </div>

    <section class="hero">
        <div class="hero-content">
            <h1>Pure & Organic</h1>
            <p>Experience the luxury of nature with our handcrafted, organic soaps. Made to nourish your skin and soul.</p>
            <a href="shop.html" class="btn btn-primary">Shop Collection</a>
        </div>
    </section>

    <section class="products-section">
        <h2 class="section-title">Featured Soaps</h2>
        <div class="grid" id="featured-products-grid">
            <!-- Dynamic products injected here by main.js -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Coral Coast Soapery. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
